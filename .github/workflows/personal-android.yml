name: Personal Android APK

on:
  push:
    branches: [codex/android-book-discovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      NEXT_PUBLIC_APP_PLATFORM: tauri
      NEXT_PUBLIC_DISABLE_UPDATER: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'ndk;28.2.13676358'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266
        with:
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @readest/readest-app setup-vendors
      - name: Build unsigned arm64 APK
        working-directory: apps/readest-app
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          mv src-tauri/gen/android "$RUNNER_TEMP/android-templates"
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git restore .
          pnpm tauri android build --apk --target aarch64
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' -print -quit)
          cp "$apk" "$RUNNER_TEMP/readest-arm64.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: readest-arm64
          path: ${{ runner.temp }}/readest-arm64.apk
          if-no-files-found: error
          retention-days: 7
